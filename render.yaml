# Render Blueprint: New -> Blueprint -> pick this repo. Nothing to paste:
# Render generates SERVER_SECRET and the server derives its keys from it.
services:
  - type: web
    name: bumper-balls
    runtime: docker
    plan: starter
    numInstances: 1          # exactly one: rooms live in memory
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SERVER_SECRET   # never change it once paid matches exist: the escrow and signer keys come from it
        generateValue: true
      - key: CHAIN_ID
        value: "46630"       # Robinhood Chain testnet
      # Required: add PRIVY_APP_ID (the App ID from dashboard.privy.io) for email/Google sign-in with built-in wallets
      - key: PRIVY_APP_ID
        sync: false          # Render asks for it when the Blueprint is created
